name: Varredura tributaria oficial

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  models: read

concurrency:
  group: tax-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANALYSIS_PROVIDER: github
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: openai/gpt-4o-mini
      PYTHON_COMMAND: python3
      MONITOR_ENABLED: 'false'
      MONITOR_LOOKBACK_DAYS: '7'
      MONITOR_MAX_ANALYSES_PER_RUN: '2'
      OLLAMA_TIMEOUT_MS: '180000'
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back/scraper/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci --prefix back
          python -m pip install -r back/scraper/requirements.txt

      - name: Consultar, analisar e registrar fontes oficiais
        run: node back/scripts/run-monitor.js

      - name: Publicar dados atualizados
        run: |
          if git diff --quiet -- back/data/database.json; then
            echo "Nenhuma alteracao nos dados."
            exit 0
          fi
          git config user.name "informer-tributario[bot]"
          git config user.email "informer-tributario[bot]@users.noreply.github.com"
          git add back/data/database.json
          git commit -m "Atualiza varredura tributaria oficial"
          git push origin main
