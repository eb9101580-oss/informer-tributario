name: Varredura tributaria oficial

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: tax-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OLLAMA_MODEL: qwen3:4b
      ANALYSIS_PROVIDER: 'auto'
      LLAMA_CPP_URL: 'http://127.0.0.1:8080'
      LLAMA_CPP_MODEL: 'Qwen3-4B-Q4_K_M.gguf'
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      PYTHON_COMMAND: python3
      DJEN_METADATA_PROXY_URL: 'https://informer-tributario.vercel.app/api/djen/caderno-metadata'
      DJEN_MAX_CANDIDATES_PER_TRIBUNAL_DATE: '60'
      MONITOR_ENABLED: 'false'
      MONITOR_FAST_PUBLISH: 'true'
      MONITOR_FAST_PUBLISH_PER_RUN: '20'
      MONITOR_LOOKBACK_DAYS: '2'
      MONITOR_MAX_ANALYSES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '5' }}
      OLLAMA_MAX_INPUT_CHARS: '10000'
      OLLAMA_TIMEOUT_MS: '600000'
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
      SUBSCRIPTIONS_ENCRYPTION_KEY: ${{ secrets.SUBSCRIPTIONS_ENCRYPTION_KEY }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back/scraper/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci --prefix back
          python -m pip install -r back/scraper/requirements.txt

      - name: Descobrir fontes e publicar triagem imediata
        env:
          MONITOR_ANALYZE: 'false'
          MONITOR_DISCOVER: 'true'
        run: node back/scripts/run-monitor.js

      - name: Publicar triagem antes do modelo
        run: |
          if git diff --quiet -- back/data/database.json; then
            echo "Nenhuma triagem nova."
            exit 0
          fi
          git config user.name "informer-tributario[bot]"
          git config user.email "informer-tributario[bot]@users.noreply.github.com"
          git add back/data/database.json
          git commit -m "Publica triagem tributaria imediata"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Preparar analisador local
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup bash -c 'while true; do ollama serve; sleep 2; done' > /tmp/ollama.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /tmp/ollama-tags.json; then break; fi
            sleep 2
          done
          pulled=false
          for attempt in {1..3}; do
            if ollama pull "$OLLAMA_MODEL"; then pulled=true; break; fi
            sleep 10
          done
          if [ "$pulled" != true ]; then
            echo "Nao foi possivel baixar o modelo Ollama."
            exit 1
          fi

      - name: Analisar fila persistida com o modelo
        run: |
          curl --fail --silent http://127.0.0.1:11434/api/tags > /tmp/ollama-before-monitor.json
          node back/scripts/run-analysis.js

      - name: Notificar cadastros com nota alta
        run: node back/scripts/notify-subscribers.js

      - name: Publicar dados atualizados
        run: |
          if git diff --quiet -- back/data/database.json back/data/subscriptions.json; then
            echo "Nenhuma alteracao nos dados."
            exit 0
          fi
          git config user.name "informer-tributario[bot]"
          git config user.email "informer-tributario[bot]@users.noreply.github.com"
          git add back/data/database.json back/data/subscriptions.json
          git commit -m "Atualiza varredura tributaria oficial"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
