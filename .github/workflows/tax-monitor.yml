name: Varredura tributaria oficial

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: tax-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANALYSIS_PROVIDER: ollama
      OLLAMA_MODEL: qwen3:4b
      PYTHON_COMMAND: python3
      MONITOR_ENABLED: 'false'
      MONITOR_LOOKBACK_DAYS: '7'
      MONITOR_MAX_ANALYSES_PER_RUN: '8'
      OLLAMA_MAX_INPUT_CHARS: '14000'
      OLLAMA_TIMEOUT_MS: '600000'
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
      SUBSCRIPTIONS_ENCRYPTION_KEY: ${{ secrets.SUBSCRIPTIONS_ENCRYPTION_KEY }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back/scraper/requirements.txt

      - name: Instalar dependencias
        run: |
          npm ci --prefix back
          python -m pip install -r back/scraper/requirements.txt

      - name: Preparar analisador local
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Consultar, analisar e registrar fontes oficiais
        run: node back/scripts/run-monitor.js

      - name: Notificar cadastros com nota alta
        run: node back/scripts/notify-subscribers.js

      - name: Publicar dados atualizados
        run: |
          if git diff --quiet -- back/data/database.json back/data/subscriptions.json; then
            echo "Nenhuma alteracao nos dados."
            exit 0
          fi
          git config user.name "informer-tributario[bot]"
          git config user.email "informer-tributario[bot]@users.noreply.github.com"
          git add back/data/database.json back/data/subscriptions.json
          git commit -m "Atualiza varredura tributaria oficial"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
