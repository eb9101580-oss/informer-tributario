name: Recuperar chave dos acompanhamentos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rekey:
    runs-on: ubuntu-latest
    env:
      OLD_KEY: ${{ secrets.TRACKED_ACTIONS_ENCRYPTION_KEY }}
      NEW_KEY: ${{ secrets.TRACKED_ACTIONS_ENCRYPTION_KEY_NEXT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Recriptografar sem expor dados ou chaves
        shell: bash
        run: |
          set +x
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'back/data/tracked-actions.json';
          if (!process.env.OLD_KEY || !process.env.NEW_KEY) throw new Error('Secrets de migração ausentes.');
          const document = JSON.parse(fs.readFileSync(path, 'utf8'));
          const encrypted = document.trackersEncrypted;
          const oldKey = crypto.createHash('sha256').update(process.env.OLD_KEY).digest();
          const decipher = crypto.createDecipheriv('aes-256-gcm', oldKey, Buffer.from(encrypted.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(encrypted.tag, 'base64'));
          const plaintext = Buffer.concat([
            decipher.update(Buffer.from(encrypted.data, 'base64')),
            decipher.final(),
          ]);
          const trackers = JSON.parse(plaintext.toString('utf8'));
          if (!Array.isArray(trackers)) throw new Error('Formato inesperado dos acompanhamentos.');
          const newKey = crypto.createHash('sha256').update(process.env.NEW_KEY).digest();
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', newKey, iv);
          const data = Buffer.concat([cipher.update(JSON.stringify(trackers), 'utf8'), cipher.final()]);
          fs.writeFileSync(path, JSON.stringify({
            version: 1,
            trackersEncrypted: {
              iv: iv.toString('base64'),
              tag: cipher.getAuthTag().toString('base64'),
              data: data.toString('base64'),
            },
          }, null, 2) + '\n');
          console.log(`Migração validada para ${trackers.length} acompanhamentos.`);
          NODE

      - name: Publicar arquivo recuperado
        run: |
          git config user.name "informer-tributario[bot]"
          git config user.email "informer-tributario[bot]@users.noreply.github.com"
          git add back/data/tracked-actions.json
          git commit -m "Recriptografa acompanhamentos com a chave de produção"
          git push origin main
