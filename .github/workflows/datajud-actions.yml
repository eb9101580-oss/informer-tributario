name: Atualizar ações acompanhadas no DataJud

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: datajud-actions-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar fontes oficiais pela Vercel
        run: |
          curl --fail --show-error --retry 2 --retry-delay 3 --retry-all-errors \
            -X POST "https://informer-tributario.vercel.app/api/actions/refresh-all" \
            -H "Accept: application/json"
